name: Update profile cards

on:
  schedule: [{ cron: "0 */12 * * *" }]   # every 12 hours
  workflow_dispatch:                      # "Run workflow" button
  push:                                   # rerun when the README or this file changes
    branches: [main]
    paths: [README.md, .github/workflows/profile-cards.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&include_all_commits=true&rank_icon=github&bg_color=0D0D0D&title_color=FC49DF&icon_color=FC49DF&text_color=FFFFFF&ring_color=FC49DF
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&hide=jupyter%20notebook,html,css&size_weight=0.5&count_weight=0.5&bg_color=0D0D0D&title_color=FC49DF&text_color=FFFFFF
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&background=0D0D0D&stroke=3B3B3B&ring=FC49DF&fire=FC49DF&currStreakNum=FFFFFF&sideNums=FFFFFF&currStreakLabel=FC49DF&sideLabels=FFFFFF&dates=9E9E9E
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?color_snake=#FC49DF&color_dots=#2A2A2A,#5A1A50,#93297F,#C838AE,#FC49DF

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --staged --quiet || git commit -m "Update profile cards"
          git push
